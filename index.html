<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pocketlist</title>
    <meta name="description" content="An AI-native task list: plain English becomes a typed action the app performs." />
    <!-- Inline SVG favicon, no extra request and no 404 in the console. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6b3f'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!-- Tints mobile browser chrome to match the app in each theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1013" />
    <script>
      // Seed the theme before first paint to avoid a flash of the wrong theme.
      try {
        const s = localStorage.getItem("theme");
        const dark = s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
