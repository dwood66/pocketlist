<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pocketlist</title>
    <meta name="description" content="Who played with whom in jazz, track by track. Explore a player's galaxy, play six degrees, make a playlist." />
    <!-- Link previews (Messages, Slack, LinkedIn, …). Previewers don't run JavaScript, so this one
         card stands for every page. The image must be an absolute URL; it's public/og.png. -->
    <link rel="canonical" href="https://pocketlist.music/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pocketlist" />
    <meta property="og:url" content="https://pocketlist.music/" />
    <meta property="og:title" content="Pocketlist: who played with whom, track by track" />
    <meta property="og:description" content="Pick a jazz musician and see everyone they recorded with, drawn as a galaxy. Travel star to star, play six degrees, make a playlist." />
    <meta property="og:image" content="https://pocketlist.music/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pocketlist: who played with whom, track by track. Ron Carter's galaxy of collaborators, with Herbie Hancock, Tony Williams and Wayne Shorter closest." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Inline SVG favicon (the Pocketlist mark: a record with a star in orbit). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c0e13'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e5aa50' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23e5aa50'/%3E%3Ccircle cx='24.5' cy='9' r='2.6' fill='%23efe8da'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Tints mobile browser chrome to match the app in each theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f1e8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0e13" />
    <script>
      // Seed the theme before first paint to avoid a flash of the wrong theme.
      try {
        const s = localStorage.getItem("theme");
        const dark = s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
