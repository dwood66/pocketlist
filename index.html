<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pocketlist</title>
    <meta name="description" content="Who played with whom in jazz, track by track. Explore a player's galaxy, play six degrees, make a playlist." />
    <!-- Inline SVG favicon (the Pocketlist mark: a record with a star in orbit). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c0e13'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e5aa50' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23e5aa50'/%3E%3Ccircle cx='24.5' cy='9' r='2.6' fill='%23efe8da'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Tints mobile browser chrome to match the app in each theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f1e8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0e13" />
    <script>
      // Seed the theme before first paint to avoid a flash of the wrong theme.
      try {
        const s = localStorage.getItem("theme");
        const dark = s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
